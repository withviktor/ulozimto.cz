# Produkční overlay — spouštět jako:
#   docker compose -f compose.yaml -f compose.prod.yaml --env-file .env.local up -d
#
# compose.override.yaml se při tomto způsobu spuštění NENAČTE (Docker ho
# automaticky přeskočí, pokud jsou -f přepínače zadány explicitně).
# Tím pádem nedochází k žádnému mergování portů z dev konfigurace.

services:

  # ── PHP aplikace ─────────────────────────────────────────────────────
  app:
    environment:
      APP_ENV: prod
    restart: unless-stopped

  # ── Nginx — HTTP only, SSL termínuje NPM ─────────────────────────────
  nginx:
    ports:
      - "127.0.0.1:8080:80"   # Jediný port; NPM přistupuje přes localhost:8080
    volumes:
      - ./public:/var/www/html/public:ro
      - ./docker/nginx/default.prod.conf:/etc/nginx/conf.d/default.conf:ro
      # Cert volume se nemapuje — SSL řeší NPM
    restart: unless-stopped

  # ── PostgreSQL — neexponovat navenek ─────────────────────────────────
  postgres:
    # Žádné ports — DB dostupná jen interně v Docker síti
    environment:
      POSTGRES_DB:       app
      POSTGRES_USER:     app
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Nastav POSTGRES_PASSWORD v .env.local}
    restart: unless-stopped

  # ── MinIO — dostupné přes NPM jako cdn.ulozimto.cz ───────────────────
  minio:
    ports:
      - "127.0.0.1:9000:9000"   # NPM proxuje cdn.ulozimto.cz → localhost:9000
      # Port 9001 (konzole) neexponujeme; přistup přes SSH tunnel:
      #   ssh -L 9001:localhost:9001 user@server
    environment:
      MINIO_ROOT_USER:     ${MINIO_KEY:?Nastav MINIO_KEY v .env.local}
      MINIO_ROOT_PASSWORD: ${MINIO_SECRET:?Nastav MINIO_SECRET v .env.local}
    restart: unless-stopped

  # ── Redis ─────────────────────────────────────────────────────────────
  redis:
    restart: unless-stopped

  # ── ClamAV — platform: linux/amd64 je native pro x86_64, override nepotřebný ──
  clamav:
    restart: unless-stopped

  # ── Worker ───────────────────────────────────────────────────────────
  worker:
    environment:
      APP_ENV: prod
    restart: unless-stopped

  # ── Mailpit — v produkci vypnout ────────────────────────────────────
  mailer:
    profiles:
      - dev

# Produkční overlay — spouštět jako:
#   docker compose -f compose.yaml -f compose.prod.yaml --env-file .env.local up -d
#
# .env.local musí obsahovat (viz README nebo bin/deploy.sh):
#   APP_ENV, APP_SECRET, POSTGRES_PASSWORD, DATABASE_URL,
#   MINIO_KEY, MINIO_SECRET, MINIO_PUBLIC_URL, RESEND_*, MAILER_DSN

services:

  # ── PHP aplikace ─────────────────────────────────────────────────────
  app:
    environment:
      APP_ENV: prod
    restart: unless-stopped

  # ── Nginx — HTTP only, SSL termínuje NPM ─────────────────────────────
  nginx:
    ports:
      - "127.0.0.1:8080:80"   # Bind jen na localhost; NPM přistupuje přes localhost:8080
    volumes:
      - ./public:/var/www/html/public:ro
      - ./docker/nginx/default.prod.conf:/etc/nginx/conf.d/default.conf:ro
      # Žádný cert volume — SSL řeší NPM
    restart: unless-stopped

  # ── PostgreSQL — neexponovat navenek ─────────────────────────────────
  postgres:
    ports: []   # Přepíše dev port 5432:5432 — DB dostupná jen interně
    environment:
      POSTGRES_DB:       app
      POSTGRES_USER:     app
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Nastav POSTGRES_PASSWORD v .env.local}
    restart: unless-stopped

  # ── MinIO — dostupné přes NPM jako cdn.ulozimto.cz ───────────────────
  minio:
    ports:
      - "127.0.0.1:9010:9000"   # S3 API — NPM proxuje cdn.ulozimto.cz → localhost:9000
      # Port 9001 (konzole) neexponujeme; přistup přes SSH tunnel při potřebě:
      #   ssh -L 9001:localhost:9001 user@server
    environment:
      MINIO_ROOT_USER:     ${MINIO_KEY:?Nastav MINIO_KEY v .env.local}
      MINIO_ROOT_PASSWORD: ${MINIO_SECRET:?Nastav MINIO_SECRET v .env.local}
    restart: unless-stopped

  # ── Redis ─────────────────────────────────────────────────────────────
  redis:
    restart: unless-stopped

  # ── ClamAV — x86_64 server, platform override nepotřebný ─────────────
  clamav:
    platform: ""   # Odstraní linux/amd64 z dev compose; server je nativní x86_64
    restart: unless-stopped

  # ── Worker ───────────────────────────────────────────────────────────
  worker:
    environment:
      APP_ENV: prod
    restart: unless-stopped

  # ── Mailpit — v produkci vypnout (používáme Resend) ──────────────────
  mailer:
    profiles:
      - dev   # Nespustí se bez --profile dev

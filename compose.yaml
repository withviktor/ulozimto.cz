# yaml-language-server: $schema=vendor/symfony/dependency-injection/Loader/schema/services.schema.json

services:
  app:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
    volumes:
      - ./:/var/www/html
    environment:
      APP_ENV: dev
    depends_on:
      - postgres
      - redis
      - minio
    networks:
      - ulozimto

  nginx:
    image: nginx:1.25-alpine
    ports:
      - "80:80"
    volumes:
      - ./public:/var/www/html/public:ro
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - app
    networks:
      - ulozimto

  postgres:
    image: postgres:${POSTGRES_VERSION:-16}-alpine
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-app}
      # You should definitely change the password in production
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-!ChangeMe!}
      POSTGRES_USER: ${POSTGRES_USER:-app}
    healthcheck:
      test: [ "CMD", "pg_isready", "-d", "${POSTGRES_DB:-app}", "-U", "${POSTGRES_USER:-app}" ]
      timeout: 5s
      retries: 5
      start_period: 60s
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - ulozimto

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    ports:
      - "9000:9000"   # S3 API
      - "9001:9001"   # MinIO web konzole
    environment:
      MINIO_ROOT_USER: minio
      MINIO_ROOT_PASSWORD: minio_secret
    volumes:
      - minio_data:/data
    networks:
      - ulozimto

  redis:
    image: redis:7-alpine
    networks:
      - ulozimto

  clamav:
    image: clamav/clamav:stable
    platform: linux/amd64
    volumes:
      - clamav_data:/var/lib/clamav
    networks:
      - ulozimto
    # ClamAV při prvním spuštění stáhne virovou databázi (~300 MB) — může trvat 2-5 minut
    healthcheck:
      test: ["CMD-SHELL", "clamdcheck.sh || exit 1"]
      interval: 60s
      timeout: 10s
      retries: 5
      start_period: 180s

  worker:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
    command: php bin/console messenger:consume async scan_priority scan_default scheduler_default --time-limit=3600 -vv
    volumes:
      - ./:/var/www/html
    depends_on:
      - postgres
      - redis
      - minio
      - clamav
    restart: unless-stopped
    networks:
      - ulozimto

  ###> symfony/mailer ###
  mailer:
    image: axllent/mailpit
    ports:
      - "1025"
      - "8025"
    environment:
      MP_SMTP_AUTH_ACCEPT_ANY: 1
      MP_SMTP_AUTH_ALLOW_INSECURE: 1
    networks:
      - ulozimto
  ###< symfony/mailer ###

volumes:
  postgres_data:
  minio_data:
  clamav_data:

networks:
  ulozimto:
    driver: bridge

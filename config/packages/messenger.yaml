framework:
    messenger:
        failure_transport: failed

        transports:
            async:
                dsn: '%env(REDIS_URL)%'
                options:
                    stream: messages
                    group: symfony
                retry_strategy:
                    max_retries: 3
                    delay: 1000
                    multiplier: 2

            scan_priority:
                dsn: '%env(REDIS_URL)%'
                options:
                    stream: scan_priority
                    group: symfony
                retry_strategy:
                    max_retries: 2
                    delay: 2000

            scan_default:
                dsn: '%env(REDIS_URL)%'
                options:
                    stream: scan_default
                    group: symfony
                retry_strategy:
                    max_retries: 2
                    delay: 5000

            failed:
                dsn: '%env(REDIS_URL)%'
                options:
                    stream: messages_failed
                    group: symfony

        routing:
            App\Message\PurgeExpiredFilesMessage: async
            # ScanFileMessage se routuje dynamicky přes TransportNamesStamp (PLUS → scan_priority, free → scan_default)

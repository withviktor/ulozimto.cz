# see https://symfony.com/doc/current/reference/configuration/framework.html
framework:
    secret: '%env(APP_SECRET)%'

    # Důvěřovat proxy (Nginx Proxy Manager).
    # REMOTE_ADDR = okamžitá volající IP (nginx kontejner) — bezpečné, protože
    # na port 8080 se dostane jen NPM přes localhost.
    # Bez tohoto by $request->isSecure() = false → URL generátor by produkoval
    # http:// místo https://, cookies by neměly Secure flag, atd.
    trusted_proxies: 'REMOTE_ADDR'
    trusted_headers:
        - 'x-forwarded-for'
        - 'x-forwarded-host'
        - 'x-forwarded-proto'
        - 'x-forwarded-port'
        - 'x-forwarded-prefix'

    # Note that the session will be started ONLY if you read or write from it.
    session:
        handler_id: null
        cookie_secure: auto
        cookie_samesite: lax
    csrf_protection: true
    http_method_override: false
    php_errors:
        log: true

    #esi: true
    #fragments: true

when@test:
    framework:
        test: true
        session:
            storage_factory_id: session.storage.factory.mock_file

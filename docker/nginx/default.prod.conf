# Produkční nginx konfigurace
# ─────────────────────────────────────────────────────────────────────
# SSL a HTTPS redirect řeší Nginx Proxy Manager (NPM).
# Tento nginx poslouchá na plain HTTP portu 80 a NEPŘESMĚROVÁVÁ.
# NPM nastaví hlavičky X-Forwarded-Proto, X-Forwarded-For atd.
# ─────────────────────────────────────────────────────────────────────

server {
    listen 80;
    server_name _;

    root  /var/www/html/public;
    index index.php;

    # ── Skutečná IP klienta z NPM hlavičky ───────────────────────────
    real_ip_header     X-Real-IP;
    real_ip_recursive  on;
    set_real_ip_from   0.0.0.0/0;   # Důvěřujeme všem, protože přístup přes
                                     # localhost:8080 = pouze NPM

    # ── Upload bez limitu ─────────────────────────────────────────────
    client_max_body_size 0;
    client_body_timeout  3600s;
    send_timeout         3600s;

    # ── Security headers ──────────────────────────────────────────────
    # HSTS posílá NPM; duplicitní hlavička by způsobila problémy
    add_header X-Frame-Options        "SAMEORIGIN"                         always;
    add_header X-Content-Type-Options "nosniff"                            always;
    add_header Referrer-Policy        "strict-origin-when-cross-origin"    always;

    # ── Web App Manifest ──────────────────────────────────────────────
    location = /site.webmanifest {
        types { }
        default_type application/manifest+json;
        try_files $uri =404;
    }

    # ── Statické soubory — přímý serving bez PHP ──────────────────────
    location ~* \.(ico|png|jpg|jpeg|gif|webp|svg|woff2|woff|ttf|css|js|map)$ {
        expires 30d;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # ── Symfony front controller ──────────────────────────────────────
    location / {
        try_files $uri /index.php$is_args$args;
    }

    location ~ \.php$ {
        fastcgi_pass   app:9000;
        fastcgi_split_path_info ^(.+\.php)(/.*)$;
        include        fastcgi_params;
        fastcgi_param  SCRIPT_FILENAME  $document_root$fastcgi_script_name;
        fastcgi_param  DOCUMENT_ROOT    $document_root;

        # Informovat PHP, že za ním je HTTPS (NPM terminuje SSL)
        # Symfony používá tuto hodnotu pro $request->isSecure() a generování URL
        fastcgi_param  HTTPS            on;

        fastcgi_read_timeout  3600s;
        fastcgi_send_timeout  3600s;
        fastcgi_buffering     off;
    }

    location ~ /\.ht {
        deny all;
    }
}
